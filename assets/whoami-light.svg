<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="whoami-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <pattern id="whoami-grid-light" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" opacity="0.3" />
    </pattern>
    <style>
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes whoamiCursorLight {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes whoamiPulseLight {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px #16a34a); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 1px #16a34a); }
      }
      @keyframes ubuntuGlitchCenterLight {
        0%, 86%, 100% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 4px rgba(234, 88, 12, 0.4));
        }
        87% {
          transform: translate(-3px, 1px);
          filter: drop-shadow(-3px 0 #0284c7) drop-shadow(3px 0 #ea580c);
        }
        89% {
          transform: translate(3px, -1px);
          filter: drop-shadow(3px 0 #0284c7) drop-shadow(-3px 0 #dc2626);
        }
        91% {
          transform: translate(-1px, 2px);
          filter: drop-shadow(-2px 0 #0284c7);
        }
        93% {
          transform: translate(0, 0);
          filter: drop-shadow(0 0 5px #ea580c);
        }
      }
      .terminal-cursor-light {
        animation: whoamiCursorLight 0.9s infinite;
      }
      .status-pulse-light {
        animation: whoamiPulseLight 2s infinite ease-in-out;
      }
      .ubuntu-glitch-center-light {
        animation: ubuntuGlitchCenterLight 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="360" rx="16" fill="url(#whoami-bg-light)" stroke="#cbd5e1" stroke-width="1.5" />
  <rect width="900" height="360" rx="16" fill="url(#whoami-grid-light)" />

  <!-- Window Header Bar -->
  <rect width="900" height="42" rx="16" fill="#f8fafc" />
  <rect y="26" width="900" height="16" fill="#f8fafc" />
  <line x1="0" y1="42" x2="900" y2="42" stroke="#e2e8f0" stroke-width="1" />

  <!-- Mac / Linux Terminal Window Dots -->
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="50%" y="26" text-anchor="middle" fill="#475569" font-size="12" class="mono-text" font-weight="600" letter-spacing="0.5">
    amirudin@sysadmin-node: ~ whoami --neofetch (Ubuntu Server 24.04 LTS)
  </text>

  <!-- Top Right Live Status -->
  <g transform="translate(780, 21)">
    <circle cx="0" cy="0" r="4.5" fill="#16a34a" class="status-pulse-light" />
    <text x="12" y="4" fill="#16a34a" font-size="11" class="mono-text" font-weight="700" letter-spacing="1">ONLINE</text>
  </g>

  <!-- Left Side: Distro Platform Box -->
  <g transform="translate(35, 62)">
    <rect width="225" height="276" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Top Label -->
    <text x="112.5" y="32" text-anchor="middle" fill="#0369a1" font-size="10" class="mono-text" font-weight="700" letter-spacing="1.5">
      DISTRO PLATFORM
    </text>

    <!-- Ubuntu Glitch Circle of Friends (Perfect Center) -->
    <g transform="translate(112.5, 108)">
      <g class="ubuntu-glitch-center-light">
        <circle cx="0" cy="0" r="42" fill="#E95420" />
        <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="5.5" />
        <circle cx="-25" cy="0" r="5.8" fill="#ffffff" />
        <circle cx="12.5" cy="-21.6" r="5.8" fill="#ffffff" />
        <circle cx="12.5" cy="21.6" r="5.8" fill="#ffffff" />
        <line x1="-12" y1="0" x2="-38" y2="0" stroke="#E95420" stroke-width="4" />
        <line x1="6" y1="-10.4" x2="19" y2="-33" stroke="#E95420" stroke-width="4" />
        <line x1="6" y1="10.4" x2="19" y2="33" stroke="#E95420" stroke-width="4" />
      </g>
    </g>

    <!-- Text info below logo -->
    <text x="112.5" y="185" text-anchor="middle" fill="#0f172a" font-size="14.5" class="sans-text" font-weight="800" letter-spacing="0.5">
      UBUNTU SERVER
    </text>
    <text x="112.5" y="206" text-anchor="middle" fill="#ea580c" font-size="12" class="mono-text" font-weight="700">
      24.04 LTS Noble
    </text>

    <!-- Sub-status pill -->
    <rect x="25" y="228" width="175" height="26" rx="6" fill="#e2e8f0" />
    <circle cx="42" cy="241" r="3.5" fill="#16a34a" class="status-pulse-light" />
    <text x="54" y="245" fill="#334155" font-size="10" class="mono-text" font-weight="600">KERNEL 6.8 x86_64</text>
  </g>

  <!-- Right Side: Neofetch Terminal Specs -->
  <g transform="translate(275, 62)">
    <rect width="590" height="276" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Terminal Prompt & Command -->
    <g transform="translate(24, 28)">
      <text x="0" y="0" fill="#16a34a" font-size="13" class="mono-text" font-weight="700">amirudin@sysadmin-node:~$</text>
      <text x="210" y="0" fill="#0f172a" font-size="13" class="mono-text">neofetch --telemetry</text>
    </g>

    <line x1="24" y1="40" x2="566" y2="40" stroke="#e2e8f0" stroke-width="1" />

    <!-- Key-Value Specs Table -->
    <g transform="translate(24, 65)" font-size="11.5" class="mono-text">
      <!-- Line 1: OS -->
      <text x="0" y="0" fill="#0284c7" font-weight="700">OS</text>
      <text x="95" y="0" fill="#94a3b8">:</text>
      <text x="110" y="0" fill="#0f172a">Ubuntu Server 24.04 LTS (x86_64) • RouterOS v7</text>

      <!-- Line 2: Kernel & Uptime -->
      <text x="0" y="22" fill="#0284c7" font-weight="700">Kernel</text>
      <text x="95" y="22" fill="#94a3b8">:</text>
      <text x="110" y="22" fill="#334155">Linux 6.8.0-generic <tspan fill="#94a3b8">|</tspan> Uptime: <tspan fill="#16a34a" font-weight="600">99.98% Available</tspan></text>

      <!-- Line 3: Role -->
      <text x="0" y="44" fill="#0284c7" font-weight="700">Role</text>
      <text x="95" y="44" fill="#94a3b8">:</text>
      <text x="110" y="44" fill="#0f172a" font-weight="600">Linux System Administrator &amp; Network Engineer</text>

      <!-- Line 4: Location -->
      <text x="0" y="66" fill="#0284c7" font-weight="700">Location</text>
      <text x="95" y="66" fill="#94a3b8">:</text>
      <text x="110" y="66" fill="#0f172a">Lampung, Indonesia <tspan fill="#64748b">(WIB / UTC+7)</tspan></text>

      <!-- Line 5: Education -->
      <text x="0" y="88" fill="#0284c7" font-weight="700">Education</text>
      <text x="95" y="88" fill="#94a3b8">:</text>
      <text x="110" y="88" fill="#0f172a">S1 Sistem Informasi (Lampung) <tspan fill="#64748b">• Ex-TKJ SMK PGRI 2</tspan></text>

      <!-- Line 6: Shell & Daemons -->
      <text x="0" y="110" fill="#0284c7" font-weight="700">Shell</text>
      <text x="95" y="110" fill="#94a3b8">:</text>
      <text x="110" y="110" fill="#334155">/bin/bash, zsh <tspan fill="#94a3b8">|</tspan> Daemons: <tspan fill="#0f172a">Nginx, BIND9, SSH, systemd</tspan></text>

      <!-- Line 7: Networking -->
      <text x="0" y="132" fill="#0284c7" font-weight="700">Network</text>
      <text x="95" y="132" fill="#94a3b8">:</text>
      <text x="110" y="132" fill="#0f172a">MikroTik RouterOS, VLAN 802.1Q, FTTH Splicing, OPM</text>

      <!-- Line 8: Status -->
      <text x="0" y="154" fill="#0284c7" font-weight="700">Status</text>
      <text x="95" y="154" fill="#94a3b8">:</text>
      <text x="110" y="154" fill="#16a34a" font-weight="700">● ACTIVE (RUNNING)</text>
      <text x="260" y="154" fill="#64748b">Ready for IT &amp; Infrastructure Roles</text>
      <rect x="525" y="142" width="7" height="14" fill="#0284c7" class="terminal-cursor-light" />
    </g>

    <!-- Terminal ANSI Color Palette Strip -->
    <g transform="translate(24, 246)">
      <circle cx="8" cy="8" r="6.5" fill="#0f172a" />
      <circle cx="28" cy="8" r="6.5" fill="#ef4444" />
      <circle cx="48" cy="8" r="6.5" fill="#ea580c" />
      <circle cx="68" cy="8" r="6.5" fill="#ca8a04" />
      <circle cx="88" cy="8" r="6.5" fill="#16a34a" />
      <circle cx="108" cy="8" r="6.5" fill="#0891b2" />
      <circle cx="128" cy="8" r="6.5" fill="#2563eb" />
      <circle cx="148" cy="8" r="6.5" fill="#7c3aed" />
      <circle cx="168" cy="8" r="6.5" fill="#db2777" />
      <text x="195" y="12" fill="#64748b" font-size="10" class="mono-text">ANSI 256-COLOR PALETTE</text>
    </g>
  </g>
</svg>
