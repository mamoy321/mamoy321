<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="100%" height="100%">
  <defs>
    <linearGradient id="arcade-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <style>
      .retro-text {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      }
      @keyframes pacmanWalk {
        0% { transform: translateX(-50px); }
        100% { transform: translateX(960px); }
      }
      @keyframes pacmanChompTop {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-28deg); }
      }
      @keyframes pacmanChompBottom {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(28deg); }
      }
      @keyframes ghostFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes powerPelletGlow {
        0%, 100% { r: 5; opacity: 1; filter: drop-shadow(0 0 5px #eab308); }
        50% { r: 3.5; opacity: 0.4; filter: drop-shadow(0 0 1px #eab308); }
      }
      .pacman-runner {
        animation: pacmanWalk 10s linear infinite;
      }
      .chomp-top {
        animation: pacmanChompTop 0.28s infinite alternate ease-in-out;
        transform-origin: 22px 22px;
      }
      .chomp-bottom {
        animation: pacmanChompBottom 0.28s infinite alternate ease-in-out;
        transform-origin: 22px 22px;
      }
      .ghost-bob {
        animation: ghostFloat 0.6s infinite alternate ease-in-out;
      }
      .power-glow {
        animation: powerPelletGlow 1s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Arcade Enclosure -->
  <rect width="900" height="140" rx="12" fill="url(#arcade-bg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Arcade Neon Header Line -->
  <line x1="16" y1="36" x2="884" y2="36" stroke="#1e3a8a" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="28" y="24" fill="#ef4444" font-size="11" class="retro-text" font-weight="700">1UP: 2026</text>
  <text x="50%" y="24" text-anchor="middle" fill="#38bdf8" font-size="11" class="retro-text" font-weight="700" letter-spacing="1.5">
    PAC-MAN : INFRASTRUCTURE RUNNER
  </text>
  <text x="872" y="24" text-anchor="end" fill="#eab308" font-size="11" class="retro-text" font-weight="700">HIGH: 99990</text>

  <!-- Blue Maze Rails -->
  <g stroke="#2563eb" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 20 54 L 880 54" />
    <path d="M 20 114 L 880 114" />
    <!-- Maze corner accents -->
    <path d="M 20 66 L 36 66 L 36 102 L 20 102" />
    <path d="M 880 66 L 864 66 L 864 102 L 880 102" />
  </g>

  <!-- Stationary Food Pellets in Maze -->
  <g fill="#fde047">
    <circle cx="60" cy="84" r="2.5" opacity="0.8" />
    <circle cx="110" cy="84" r="2.5" opacity="0.8" />
    <circle cx="160" cy="84" r="2.5" opacity="0.8" />
    <circle cx="210" cy="84" r="2.5" opacity="0.8" />
    <circle cx="260" cy="84" r="2.5" opacity="0.8" />
    <circle cx="310" cy="84" r="2.5" opacity="0.8" />
    <circle cx="360" cy="84" r="2.5" opacity="0.8" />
    <circle cx="410" cy="84" r="2.5" opacity="0.8" />
    <circle cx="460" cy="84" r="2.5" opacity="0.8" />
    <circle cx="510" cy="84" r="2.5" opacity="0.8" />
    <circle cx="560" cy="84" r="2.5" opacity="0.8" />
    <circle cx="610" cy="84" r="2.5" opacity="0.8" />
    <circle cx="660" cy="84" r="2.5" opacity="0.8" />
    <circle cx="710" cy="84" r="2.5" opacity="0.8" />
    <circle cx="760" cy="84" r="2.5" opacity="0.8" />
    <circle cx="810" cy="84" r="2.5" opacity="0.8" />
    <!-- Power Pellets -->
    <circle cx="80" cy="84" r="5" class="power-glow" fill="#facc15" />
    <circle cx="840" cy="84" r="5" class="power-glow" fill="#facc15" />
  </g>

  <!-- Animated Character Parade: Pacman eating pellets, followed by ghosts! -->
  <g class="pacman-runner">
    <!-- PACMAN -->
    <g transform="translate(140, 62)">
      <!-- Top Jaw -->
      <path class="chomp-top" d="M 22 22 L 44 22 A 22 22 0 0 0 0 22 Z" fill="#FACC15" />
      <!-- Bottom Jaw -->
      <path class="chomp-bottom" d="M 22 22 L 44 22 A 22 22 0 0 1 0 22 Z" fill="#FACC15" />
    </g>

    <!-- GHOST 1: Blinky (Red) -->
    <g class="ghost-bob" transform="translate(85, 68)">
      <path d="M 0 16 A 16 16 0 0 1 32 16 L 32 30 L 26.6 26 L 21.3 30 L 16 26 L 10.6 30 L 5.3 26 L 0 30 Z" fill="#EF4444" />
      <circle cx="10" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="22" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="14" r="2.2" fill="#2563eb" />
      <circle cx="24" cy="14" r="2.2" fill="#2563eb" />
    </g>

    <!-- GHOST 2: Pinky (Pink) -->
    <g class="ghost-bob" transform="translate(45, 68)">
      <path d="M 0 16 A 16 16 0 0 1 32 16 L 32 30 L 26.6 26 L 21.3 30 L 16 26 L 10.6 30 L 5.3 26 L 0 30 Z" fill="#EC4899" />
      <circle cx="10" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="22" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="14" r="2.2" fill="#2563eb" />
      <circle cx="24" cy="14" r="2.2" fill="#2563eb" />
    </g>

    <!-- GHOST 3: Inky (Cyan) -->
    <g class="ghost-bob" transform="translate(5, 68)">
      <path d="M 0 16 A 16 16 0 0 1 32 16 L 32 30 L 26.6 26 L 21.3 30 L 16 26 L 10.6 30 L 5.3 26 L 0 30 Z" fill="#06B6D4" />
      <circle cx="10" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="22" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="14" r="2.2" fill="#2563eb" />
      <circle cx="24" cy="14" r="2.2" fill="#2563eb" />
    </g>

    <!-- GHOST 4: Clyde (Orange) -->
    <g class="ghost-bob" transform="translate(-35, 68)">
      <path d="M 0 16 A 16 16 0 0 1 32 16 L 32 30 L 26.6 26 L 21.3 30 L 16 26 L 10.6 30 L 5.3 26 L 0 30 Z" fill="#F97316" />
      <circle cx="10" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="22" cy="14" r="4.5" fill="#ffffff" />
      <circle cx="12" cy="14" r="2.2" fill="#2563eb" />
      <circle cx="24" cy="14" r="2.2" fill="#2563eb" />
    </g>
  </g>
</svg>
