<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pacmanRun {
        0% { transform: translateX(-40px); }
        100% { transform: translateX(950px); }
      }
      @keyframes chompUpper {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-30deg); }
      }
      @keyframes chompLower {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(30deg); }
      }
      @keyframes ghostBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes powerGlow {
        0%, 100% { r: 5; opacity: 1; filter: drop-shadow(0 0 4px #ca8a04); }
        50% { r: 3.5; opacity: 0.5; }
      }
      .pacman-runner {
        animation: pacmanRun 8.5s linear infinite;
      }
      .mouth-upper {
        animation: chompUpper 0.24s infinite alternate ease-in-out;
        transform-origin: 16px 16px;
      }
      .mouth-lower {
        animation: chompLower 0.24s infinite alternate ease-in-out;
        transform-origin: 16px 16px;
      }
      .ghost-bob {
        animation: ghostBob 0.5s infinite alternate ease-in-out;
      }
      .power-dot {
        animation: powerGlow 1s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Arcade Enclosure -->
  <rect width="900" height="95" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />

  <!-- Neon Maze Track Rails -->
  <g stroke="#0284c7" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 24 24 L 876 24" />
    <path d="M 24 72 L 876 72" />
    <path d="M 24 34 L 38 34 L 38 62 L 24 62" />
    <path d="M 876 34 L 862 34 L 862 62 L 876 62" />
  </g>

  <!-- Food Pellets along the track -->
  <g fill="#eab308">
    <circle cx="60" cy="48" r="2.5" opacity="0.85" />
    <circle cx="105" cy="48" r="2.5" opacity="0.85" />
    <circle cx="150" cy="48" r="2.5" opacity="0.85" />
    <circle cx="195" cy="48" r="2.5" opacity="0.85" />
    <circle cx="240" cy="48" r="2.5" opacity="0.85" />
    <circle cx="285" cy="48" r="2.5" opacity="0.85" />
    <circle cx="330" cy="48" r="2.5" opacity="0.85" />
    <circle cx="375" cy="48" r="2.5" opacity="0.85" />
    <circle cx="420" cy="48" r="2.5" opacity="0.85" />
    <circle cx="465" cy="48" r="2.5" opacity="0.85" />
    <circle cx="510" cy="48" r="2.5" opacity="0.85" />
    <circle cx="555" cy="48" r="2.5" opacity="0.85" />
    <circle cx="600" cy="48" r="2.5" opacity="0.85" />
    <circle cx="645" cy="48" r="2.5" opacity="0.85" />
    <circle cx="690" cy="48" r="2.5" opacity="0.85" />
    <circle cx="735" cy="48" r="2.5" opacity="0.85" />
    <circle cx="780" cy="48" r="2.5" opacity="0.85" />
    <circle cx="825" cy="48" r="2.5" opacity="0.85" />
    <!-- Power Pellets -->
    <circle cx="82" cy="48" r="5" class="power-dot" fill="#ca8a04" />
    <circle cx="848" cy="48" r="5" class="power-dot" fill="#ca8a04" />
  </g>

  <!-- Animated Pac-Man & 4 Ghosts Parade -->
  <g class="pacman-runner" transform="translate(0, 32)">
    <!-- PACMAN -->
    <g transform="translate(130, 0)">
      <path class="mouth-upper" d="M 16 16 L 32 16 A 16 16 0 0 0 0 16 Z" fill="#FACC15" />
      <path class="mouth-lower" d="M 16 16 L 32 16 A 16 16 0 0 1 0 16 Z" fill="#FACC15" />
    </g>

    <!-- GHOST 1: Blinky (Red) -->
    <g class="ghost-bob" transform="translate(85, 4)">
      <path d="M 0 13 A 13 13 0 0 1 26 13 L 26 24 L 21.6 21 L 17.3 24 L 13 21 L 8.6 24 L 4.3 21 L 0 24 Z" fill="#EF4444" />
      <circle cx="8" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="18" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="9.5" cy="11" r="1.8" fill="#1d4ed8" />
      <circle cx="19.5" cy="11" r="1.8" fill="#1d4ed8" />
    </g>

    <!-- GHOST 2: Pinky (Pink) -->
    <g class="ghost-bob" transform="translate(50, 4)">
      <path d="M 0 13 A 13 13 0 0 1 26 13 L 26 24 L 21.6 21 L 17.3 24 L 13 21 L 8.6 24 L 4.3 21 L 0 24 Z" fill="#EC4899" />
      <circle cx="8" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="18" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="9.5" cy="11" r="1.8" fill="#1d4ed8" />
      <circle cx="19.5" cy="11" r="1.8" fill="#1d4ed8" />
    </g>

    <!-- GHOST 3: Inky (Cyan) -->
    <g class="ghost-bob" transform="translate(15, 4)">
      <path d="M 0 13 A 13 13 0 0 1 26 13 L 26 24 L 21.6 21 L 17.3 24 L 13 21 L 8.6 24 L 4.3 21 L 0 24 Z" fill="#06B6D4" />
      <circle cx="8" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="18" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="9.5" cy="11" r="1.8" fill="#1d4ed8" />
      <circle cx="19.5" cy="11" r="1.8" fill="#1d4ed8" />
    </g>

    <!-- GHOST 4: Clyde (Orange) -->
    <g class="ghost-bob" transform="translate(-20, 4)">
      <path d="M 0 13 A 13 13 0 0 1 26 13 L 26 24 L 21.6 21 L 17.3 24 L 13 21 L 8.6 24 L 4.3 21 L 0 24 Z" fill="#F97316" />
      <circle cx="8" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="18" cy="11" r="3.6" fill="#ffffff" />
      <circle cx="9.5" cy="11" r="1.8" fill="#1d4ed8" />
      <circle cx="19.5" cy="11" r="1.8" fill="#1d4ed8" />
    </g>
  </g>
</svg>
